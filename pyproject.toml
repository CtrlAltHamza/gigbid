[project]
name = "gigbid-student-project"
version = "0.1.0"
description = "Student scaffold for the AI-4016 GigBid assignment"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "pyyaml",
  "langgraph",
  "langchain",
  "langchain-mcp-adapters",
  "mcp",
  "httpx",
  "python-dotenv",
  "rank-bm25",
  "cryptography",
  "reportlab",
  "pillow",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "rag*", "mcp_servers*", "gigsim*", "worker*", "apps*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E722", "E402", "F401", "F841", "F811", "E701", "F541"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

