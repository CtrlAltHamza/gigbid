[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gigbid-portfolio-mcp"
version = "0.1.0"
description = "GigBid Portfolio MCP Server — Read-only evidence retrieval and portfolio grounding"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
gigbid-portfolio-mcp = "mcp_servers.portfolio.server:mcp.run"
